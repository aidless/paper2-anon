# CI for paper2-anon
#
# Scope note, verified against the tree on 2026-10-05:
# evidence/scripts/verify_p2_cv_sensitivity_20260808.py:22 sets
#     EXP = r"<ARCHIVE_ROOT>\experiments"
# The placeholder was never substituted and no experiments/ directory is tracked in
# this repository, so the script cannot run here — it needs eleven mm_epc_* result
# files that live in the private archive, not in this repo. Pointing CI at it would
# produce a permanent red run that says nothing about this repository's health.
#
# CI therefore verifies what is actually verifiable: the tracked evidence parses and
# the verification script itself compiles. The unrunnable gate is reported, not hidden.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: The verification script must compile
        run: python -m py_compile evidence/scripts/verify_p2_cv_sensitivity_20260808.py

      - name: Tracked evidence files must exist and parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ev = pathlib.Path("evidence")
          if not ev.is_dir():
              sys.exit("no evidence/ directory")
          jsons = [j for j in ev.rglob("*.json") if ".git" not in j.parts]
          if not jsons:
              sys.exit("evidence/ contains no JSON files")
          broken = []
          for j in jsons:
              raw = j.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  text = raw.decode("gbk", errors="replace")
              try:
                  json.loads(text)
              except Exception as exc:
                  broken.append(f"{j}: {exc}")
          print(f"parsed {len(jsons)} evidence JSON files")
          if broken:
              sys.exit("not JSON:\n  " + "\n  ".join(broken))
          PY

      - name: Report the gate that cannot run here
        shell: bash
        run: |
          script=evidence/scripts/verify_p2_cv_sensitivity_20260808.py
          if grep -q '<ARCHIVE_ROOT>' "$script"; then
            echo "::warning::$script still carries an unsubstituted"
            echo "::warning::<ARCHIVE_ROOT> placeholder and needs result files that"
            echo "::warning::are not tracked in this repository, so it is not run in CI."
          fi
          echo "OK (advisory only)"

  mutation-control:
    name: The evidence gates can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Break the verification script and the JSON, and require non-zero twice
        # Two independent gates here: py_compile on the verification script, and a
        # JSON parse over evidence/. The JSON parser falls back to GBK for non-UTF-8
        # bytes, so a plain ASCII corruption still has to be caught by json.loads.
        run: |
          set -uo pipefail
          script=evidence/scripts/verify_p2_cv_sensitivity_20260808.py
          victim=$(ls evidence/*.json evidence/**/*.json 2>/dev/null | head -1)
          if [ -z "$victim" ]; then
            echo "no evidence JSON to corrupt"
            exit 1
          fi
          echo "--- baseline ---"
          # Both checks must be chained explicitly. `set -e` is off here (only -u and
          # pipefail are set), so a failed first check followed by a successful second
          # one used to print "baseline passed" anyway.
          if ! python -m py_compile "$script"; then
            echo "FAIL: py_compile is already red before any change"
            exit 1
          fi
          if ! python - "$victim" <<'PYX'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          try:
              json.loads(raw.decode("utf-8"))
          except UnicodeDecodeError:
              json.loads(raw.decode("gbk", errors="replace"))
          PYX
          then
            echo "FAIL: $victim does not parse before any change"
            exit 1
          fi
          echo "baseline passed"

          echo "--- corrupting $script ---"
          cp "$script" /tmp/script.bak
          printf '\ndef __mutation_control__(:\n' >> "$script"
          if python -m py_compile "$script" 2>/dev/null; then
            echo "FAIL: py_compile accepted a script with a syntax error"
            exit 1
          fi
          cp /tmp/script.bak "$script"
          echo "py_compile rejected it"

          echo "--- corrupting $victim ---"
          cp "$victim" /tmp/victim.bak
          printf 'not json at all {{{' >> "$victim"
          if python - "$victim" <<'PYX'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError:
              text = raw.decode("gbk", errors="replace")
          json.loads(text)
          PYX
          then
            echo "FAIL: the JSON gate accepted a file that is not JSON"
            exit 1
          fi
          cp /tmp/victim.bak "$victim"
          echo "OK: both gates rejected their corruption"

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
