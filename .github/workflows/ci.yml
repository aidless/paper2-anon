# CI for paper2-anon
#
# Scope note, verified against the tree on 2026-10-05:
# evidence/scripts/verify_p2_cv_sensitivity_20260808.py:22 sets
#     EXP = r"<ARCHIVE_ROOT>\experiments"
# The placeholder was never substituted and no experiments/ directory is tracked in
# this repository, so the script cannot run here — it needs eleven mm_epc_* result
# files that live in the private archive, not in this repo. Pointing CI at it would
# produce a permanent red run that says nothing about this repository's health.
#
# CI therefore verifies what is actually verifiable: the tracked evidence parses and
# the verification script itself compiles. The unrunnable gate is reported, not hidden.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: The verification script must compile
        run: python -m py_compile evidence/scripts/verify_p2_cv_sensitivity_20260808.py

      - name: Tracked evidence files must exist and parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ev = pathlib.Path("evidence")
          if not ev.is_dir():
              sys.exit("no evidence/ directory")
          jsons = [j for j in ev.rglob("*.json") if ".git" not in j.parts]
          if not jsons:
              sys.exit("evidence/ contains no JSON files")
          broken = []
          for j in jsons:
              raw = j.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  text = raw.decode("gbk", errors="replace")
              try:
                  json.loads(text)
              except Exception as exc:
                  broken.append(f"{j}: {exc}")
          print(f"parsed {len(jsons)} evidence JSON files")
          if broken:
              sys.exit("not JSON:\n  " + "\n  ".join(broken))
          PY

      - name: Report the gate that cannot run here
        shell: bash
        run: |
          script=evidence/scripts/verify_p2_cv_sensitivity_20260808.py
          if grep -q '<ARCHIVE_ROOT>' "$script"; then
            echo "::warning::$script still carries an unsubstituted"
            echo "::warning::<ARCHIVE_ROOT> placeholder and needs result files that"
            echo "::warning::are not tracked in this repository, so it is not run in CI."
          fi
          echo "OK (advisory only)"